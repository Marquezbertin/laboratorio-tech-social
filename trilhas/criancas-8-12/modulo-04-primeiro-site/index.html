    h1 { color: #ff6f61; }
    button {
      background: #ff6f61;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 18px;
      cursor: pointer;
    }
    button:hover { background: #e85b4f; }

</head>
<body>
  <div class="cartao">
    <!-- TROQUE "SEU NOME" PELO SEU NOME -->
    <h1>Olá! Eu sou o/a SEU NOME 👋</h1>

    <button onclick="alert('Obrigado por visitar meu site! 💙')">Clique aqui!</button>
