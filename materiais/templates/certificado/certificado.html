<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Certificado - Laboratório de Tecnologia Social</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f1f5f9; margin: 0; padding: 20px; }
    .form { background: #fff; padding: 20px; border-radius: 12px; max-width: 600px; margin: 0 auto 20px; }
    .form label { display: block; margin: 10px 0 4px; font-weight: 600; }
    .form input { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; }
    .form button { margin-top: 14px; background: #ff6f61; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; }
    .certificado {
      max-width: 800px; margin: 0 auto; background: #fff; border: 8px solid #38bdf8;
      border-radius: 16px; padding: 50px; text-align: center; position: relative;
    }
    .certificado::before { content: "🚀"; font-size: 48px; display: block; }
    .certificado h1 { color: #0f172a; letter-spacing: 4px; }
    .certificado .nome { font-size: 34px; color: #ff6f61; margin: 20px 0; font-weight: 700; }
    .certificado p { color: #334155; font-size: 18px; }
    .rodape { margin-top: 40px; font-size: 14px; color: #64748b; }
    @media print { .form { display: none; } body { background: #fff; } }
  </style>
</head>
<body>
  <div class="form">
    <h2>Preencha o certificado</h2>
    <label>Nome do aluno</label>
    <input id="nome" value="Maria Silva" />
    <label>Trilha concluída</label>
    <input id="trilha" value="Exploradores (8–12 anos)" />
    <label>Carga horária</label>
    <input id="carga" value="20 horas" />
    <label>Cidade / Data</label>
    <input id="data" value="São Pedro/SP, 2026" />
    <button onclick="gerar()">Gerar Certificado</button>
    <button onclick="window.print()">Imprimir / PDF</button>
  </div>

  <div class="certificado" id="cert">
    <h1>CERTIFICADO</h1>
    <p>Certificamos que</p>
    <div class="nome" id="outNome">Maria Silva</div>
    <p>concluiu a trilha <strong id="outTrilha">Exploradores (8–12 anos)</strong><br />
       com carga de <strong id="outCarga">20 horas</strong> de aprendizagem<br />
       no Laboratório de Tecnologia Social — projeto gratuito e aberto.</p>
    <p class="rodape" id="outData">São Pedro/SP, 2026 — Bruno Bertin Marquez · Laboratório Tech Social</p>
  </div>

  <script>
    function gerar() {
      document.getElementById("outNome").textContent = document.getElementById("nome").value;
      document.getElementById("outTrilha").textContent = document.getElementById("trilha").value;
      document.getElementById("outCarga").textContent = document.getElementById("carga").value;
      document.getElementById("outData").textContent =
        document.getElementById("data").value + " — Bruno Bertin Marquez · Laboratório Tech Social";
    }
  </script>
</body>
</html>
