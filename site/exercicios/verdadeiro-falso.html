    <h1>✅ Verdadeiro ou Falso</h1>
    <p class="faixa">Para todos</p>
    <p class="placar">Acertos: <strong id="pts">0</strong> / <span id="tot">0</span></p>

    <div class="painel">
      <div class="q" id="q"></div>
      <button id="v">✅ Verdadeiro</button>
      <button class="rosa" id="f">❌ Falso</button>
      <div class="fb" id="fb"></div>
      <button id="next" hidden>➡️ Próxima</button>
    </div>

      <a href="lista-tarefas.html">✅ Lista de Tarefas</a>

    </div>

  <div vw class="enabled"><div vw-access-button class="active"></div><div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div></div>
  <script src="https://vlibras.gov.br/app.js"></script>
  <script>new window.VLibras.Widget('https://vlibras.gov.br/app');</script>

  <script>
    const $ = id => document.getElementById(id);
    const questoes = [
      ["O computador entende linguagem de máquina (0 e 1).", true],
      ["Compartilhar sua senha com um amigo é seguro.", false],
      ["A LGPD protege os dados pessoais no Brasil.", true],
      ["WiFi significa que não precisamos de fios para a internet local.", true],
      ["Um vírus de computador pode danificar arquivos.", true],
      ["Clicar em qualquer link recebido por e-mail é seguro.", false],
      ["Algoritmo é um passo a passo para resolver algo.", true],
      ["IoT significa 'Internet das Coisas'.", true]
    ];
    let i = 0, pontos = 0;
    function render(){
      if (i >= questoes.length){ $("q").textContent = "🏆 Fim! Você acertou " + pontos + " de " + questoes.length; $("v").hidden = $("f").hidden = true; $("next").hidden = true; return; }
      $("q").textContent = (i+1) + ". " + questoes[i][0];
      $("v").hidden = $("f").hidden = false; $("next").hidden = true; $("fb").textContent = "";
    }
    function responder(resp){
      const ok = resp === questoes[i][1];
      if (ok) { pontos++; $("pts").textContent = pontos; $("fb").textContent = "✅ Acertou!"; $("fb").style.color = "#22c55e"; }
      else { $("fb").textContent = "❌ Errou! A resposta era " + (questoes[i][1] ? "Verdadeiro" : "Falso"); $("fb").style.color = "#ef4444"; }
      $("v").hidden = $("f").hidden = true; $("next").hidden = false;
    }
    $("v").onclick = () => responder(true);
    $("f").onclick = () => responder(false);
    $("next").onclick = () => { i++; render(); };
    $("tot").textContent = questoes.length; render();
  </script>
