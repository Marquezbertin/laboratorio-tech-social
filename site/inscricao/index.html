<head>
  <meta charset="UTF-8" />

  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 30px; }
    .box { max-width: 560px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 16px; border: 1px solid #334155; }
    h1 { color: #38bdf8; text-align: center; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; }
    .consent { background: #0f172a; padding: 14px; border-radius: 8px; margin-top: 10px; font-size: 0.9rem; }
    button { width: 100%; margin-top: 20px; background: #ff6f61; color: #fff; border: none; padding: 14px; border-radius: 999px; font-size: 16px; cursor: pointer; font-weight: 600; }
    button:hover { background: #e85b4f; }
    .msg { text-align: center; margin-top: 16px; display: none; padding: 12px; border-radius: 8px; }
    .ok { background: #064e3b; color: #6ee7b7; }
    .erro { background: #7f1d1d; color: #fecaca; }
  </style>
  <link rel="icon" href="/laboratorio-tech-social/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <header style="background:#1e293b;padding:14px 20px;border-bottom:1px solid #334155;">
    <nav style="max-width:1000px;margin:0 auto;display:flex;flex-wrap:wrap;gap:14px;align-items:center;">
      <span style="font-weight:700;color:#38bdf8;margin-right:auto;">🚀 Lab Tech Social</span>
      <a href="/laboratorio-tech-social/index.html" style="color:#e2e8f0;text-decoration:none;">Início</a>
      <a href="/laboratorio-tech-social/trilhas.html" style="color:#e2e8f0;text-decoration:none;">Trilhas</a>
      <a href="/laboratorio-tech-social/exercicios.html" style="color:#e2e8f0;text-decoration:none;">Exercícios</a>
      <a href="/laboratorio-tech-social/blog.html" style="color:#e2e8f0;text-decoration:none;">Blog</a>
      <a href="/laboratorio-tech-social/calendario.html" style="color:#e2e8f0;text-decoration:none;">Calendário</a>
      <a href="/laboratorio-tech-social/voluntarios.html" style="color:#e2e8f0;text-decoration:none;">Voluntários</a>

      <a href="/laboratorio-tech-social/inscricao/" style="color:#e2e8f0;text-decoration:none;">Inscrição</a>
      <a href="/laboratorio-tech-social/certificado/" style="color:#e2e8f0;text-decoration:none;">Certificados</a>
      <a href="/laboratorio-tech-social/sobre.html" style="color:#e2e8f0;text-decoration:none;">Sobre</a>
      <a href="/laboratorio-tech-social/index_en.html" style="color:#38bdf8;text-decoration:none;">EN</a>
    </nav>
  </header>
  <div class="box">
    <h1>🚀 Inscreva-se</h1>
    <p style="text-align:center;color:#94a3b8;">Laboratório de Tecnologia Social — 100% gratuito</p>

    <!-- ============================================================
         BACKEND: cole aqui o endpoint do Formspree (grátis).
         Crie em https://formspree.io  ->  "New form"  -> cole a URL abaixo.
         Exemplo: https://formspree.io/f/xblrgara
         ============================================================ -->
    <script>
      const FORM_ENDPOINT = "https://formspree.io/f/SEU_ENDPOINT_AQUI";
    </script>

    <form id="formInscricao">
      <label>Nome do aluno *</label>
      <input name="aluno_nome" required />

      <label>Idade *</label>
      <input name="aluno_idade" type="number" min="8" max="20" required />

      <label>Trilha de interesse *</label>
      <select name="trilha" required>
        <option value="">Selecione...</option>
        <option>Exploradores (8–12 anos)</option>
        <option>Makers/Devs (13–20 anos)</option>
        <option>Ainda não sei</option>
      </select>

      <label>Nome do responsável *</label>
      <input name="resp_nome" required />

      <label>E-mail do responsável *</label>
      <input name="resp_email" type="email" required />

      <label>Telefone / WhatsApp</label>
      <input name="resp_tel" />

      <div class="consent">
        <strong>Consentimento (LGPD / ECA)</strong><br />
        <label style="font-weight:400;">
          <input type="checkbox" name="consentimento" required style="width:auto;" />
          Autorizo a participação e o tratamento dos dados acima, e o uso de imagem do aluno em materiais do projeto, conforme a Política de Privacidade.
        </label>
      </div>

      <button type="submit">Enviar inscrição 💙</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById("formInscricao");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      msg.style.display = "none";

      if (FORM_ENDPOINT.includes("SEU_ENDPOINT_AQUI")) {
        msg.className = "msg erro";
        msg.textContent = "⚠️ Configure o FORM_ENDPOINT no código (veja o comentário no início do arquivo).";
        msg.style.display = "block";
        return;
      }

      const data = Object.fromEntries(new FormData(form).entries());
      try {
        const res = await fetch(FORM_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify(data)
        });
        if (res.ok) {
          msg.className = "msg ok";
          msg.textContent = "✅ Inscrição enviada! Entraremos em contato. 🎉";
          form.reset();
        } else {
          throw new Error("Falha no envio");
        }
      } catch (err) {
        msg.className = "msg erro";
        msg.textContent = "❌ Não foi possível enviar. Tente novamente ou fale conosco por e-mail.";
      }
      msg.style.display = "block";
    });
    </script>

  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div>
  </div>
  <script src="https://vlibras.gov.br/app.js"></script>
  <script>new window.VLibras.Widget('https://vlibras.gov.br/app');</script>
</body>
</html>
